name: emotion-xr
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      # CUDA 12.1 build; remove this line for a CPU-only install
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.5.1
      - torchvision==0.20.1
      - pytorch-lightning==2.4.0
      - torchmetrics==1.4.3
      - numpy==1.26.4
      - pandas==3.0.6
      - openpyxl==3.1.5
      - opencv-python-headless==4.10.0.84
      - scikit-learn==1.9.1
      - matplotlib==3.11.2
      - seaborn==0.13.2
      - tqdm==4.70.1
